on, trust: How GenAI shapes developer\nworkflows over time, especially how teams refine their use and handle\ntrust, knowledge transfer and workflow integration.\n  Interview question: Q#5, Q#8, Q#9, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 149}, {"from": "P26", "to": "GG6", "kind": "Gap", "title": "Zakharov et al. (2025) → Trust and role drift over time\n\nGAP-072 Role evolution, onboarding: How developers' conceptualisations\nof AI evolve over time, and how onboarding strategies shape role\nattribution and trust.\n  Interview question: Q#5, Q#8, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 150}, {"from": "P29", "to": "GG6", "kind": "Gap", "title": "Sabouri et al. (2025) → Trust and role drift over time\n\nGAP-080 Longitudinal trust evolution: Observe developers over longer\nperiods to see how trust evolves and settles; study automation bias;\nestimate maintainability and robustness for small snippets; test how\nage, experience, education, project type and culture shape trust.\n  Interview question: Q#1, Q#8, Q#9, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 151}, {"from": "P52", "to": "GG7", "kind": "Gap", "title": "Long et al. (2026) → Learning versus reliance\n\nGAP-149 Learning versus reliance: Productivity and difficulty are\nself-reported on short tasks, with no measure of learning or\ncorrectness: whether the felt gain (over 55% find work strenuous\nwithout the tool) reflects learning, reliance or both is open.\n  Interview question: Q#7, Q#8, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 152}, {"from": "P16", "to": "GG7", "kind": "Gap", "title": "Ulfsnes et al. (2024) → Learning versus reliance\n\nGAP-048 Learning loop unmeasured: 13 interviews in an exploratory\nmulti-case study, with no limitations section; the change in the team\nlearning loop (asking GenAI instead of coworkers) is reported, not\nfollowed over time or measured.\n  Interview question: Q#8, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 153}, {"from": "P40", "to": "GG7", "kind": "Gap", "title": "Nguyen et al. (2024) → Learning versus reliance\n\nGAP-113 Learning unmeasured: Learning outcomes were not studied\nexplicitly; the authors find only mixed support for Code LLMs as\nteaching tools.\n  Interview question: Q#7, Q#8, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 154}, {"from": "P32", "to": "GG8", "kind": "Gap", "title": "Giray et al. (2026) → Expertise redistribution, validation\n\nGAP-088 Expertise redistribution: Longitudinal research on how\nexpertise is redistributed (problem framing, creation, delegation,\nvalidation, judgement) and how this affects learning and professional\ndevelopment.\n  Interview question: Q#7, Q#8, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 155}, {"from": "P46", "to": "GG8", "kind": "Gap", "title": "Amalfitano et al. (2026) → Expertise redistribution, validation\n\nGAP-129 Untested expertise claims: Roadmap claims about eroding human\nexpertise and accountability are not yet tested against practitioners'\naccounts.\n  Interview question: Q#7, Q#9, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 156}, {"from": "P9", "to": "GG8", "kind": "Gap", "title": "Huang et al. (2026) → Expertise redistribution, validation\n\nGAP-029 Single-session observation: Each observation was one 45-minute\nsession, so no longitudinal use or full development cycle.\n  Interview question: Q#2, Q#8", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 157}, {"from": "P30", "to": "GG8", "kind": "Gap", "title": "Choudhuri et al. (2025) → Expertise redistribution, validation\n\nGAP-082 Longitudinal, GenAI-specific constructs: Use longitudinal data\nand control for familiarity and demographics; examine GenAI-specific\nconstructs such as ease of prompting and tinkering with prompt\nstrategies; trust may differ by work  effects need longitudinal case studies.\n  Interview question: Q#8, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 163}, {"from": "P51", "to": "GG10", "kind": "Gap", "title": "Moreno-Lumbreras et al. (2026) → Hidden code, bloat, practice evidence\n\nGAP-145 Workplace demand untested: Whether developers in company work\nwant branching and provenance for AI output, beyond version control,\ntests and review, is untested; the case rests on a vision and ten\nvolunteers, not on observed practice.\n  Interview question: Q#2.2, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 164}, {"from": "P54", "to": "GG10", "kind": "Gap", "title": "Hassan et al. (2026) → Hidden code, bloat, practice evidence\n\nGAP-157 Hidden-code acceptance: The vision hides code by default and\nmoves intent into conversation, while the cited survey says developers\nwant control and distrust output; how practitioners now split intent,\nprompts and code, and how they would take hidden code, is not\nexamined.\n  Interview question: Q#2, Q#2.2, Q#9, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 165}, {"from": "P6", "to": "GG10", "kind": "Gap", "title": "Borg et al. (2026) → Hidden code, bloat, practice evidence\n\nGAP-020 Bloat, cognitive debt: Research on when LLM output improves\nmaintainability, on code bloat and cognitive debt (shallow\nunderstanding of AI-generated code), and on knowledge management in\norganisations.\n  Interview question: Q#9, Q#12, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 166}, {"from": "P47", "to": "GG10", "kind": "Gap", "title": "Brun et al. (2026) → Hidden code, bloat, practice evidence\n\nGAP-131 No practice evidence: A vision for formal verification with no\nevidence from everyday practice: how reliance on generated code, trust\nand responsibility play out day to day is not examined.\n  Interview question: Q#2.2, Q#9, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 167}, {"from": "P25", "to": "GG11", "kind": "Gap", "title": "Brandebusemeyer et al. (2026) → Weak outcome and load measures\n\nGAP-069 Subjective load measures: Perceived cognitive load,\nproductivity and satisfaction are individual, experience- and\ntask-dependent; objective data (physiological, keyboard and mouse) are\nstill to be analysed.\n  Interview question: Q#2.3, Q#9, Q#10", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 168}, {"from": "P51", "to": "GG11", "kind": "Gap", "title": "Moreno-Lumbreras et al. (2026) → Weak outcome and load measures\n\nGAP-144 Seven-part agenda: A seven-part agenda: provenance and\ncode-evolution tracking, intent-based navigation, interactive\nregeneration with constraints, parallel exploration without decision\nfatigue, continuous regeneration pipelines, sandboxing and safety, and\ncognitive load, trust and explainability.\n  Interview question: Q#3, Q#4, Q#9, Q#10", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 169}, {"from": "P4", "to": "GG11", "kind": "Gap", "title": "Heilman et al. (2026) → Weak outcome and load measures\n\nGAP-012 Narrow outcome measure: PR count captures activity and\nefficiency only; satisfaction, performance and communication are\nunmeasured; PR complexity is only partly captured (Azure DevOps repos\nonly).\n  Interview question: Q#9, Q#10, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 170}, {"from": "P10", "to": "GG11", "kind": "Gap", "title": "Baumann et al. (2026) → Weak outcome and load measures\n\nGAP-032 Abandoned sessions missing: Abandoned sessions are missing\n(success likely overestimated); line-level attribution can undercount\nagent code that survives in changed form; committed lines and prompt\ncharacters only proxy satisfaction and efficiency.\n  Interview question: Q#2.3, Q#9, Q#10", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 171}, {"from": "P10", "to": "GG12", "kind": "Gap", "title": "Baumann et al. (2026) → Effects and reasons unasked\n\nGAP-034 Pushback reasons hidden: Reasons for pushing back in about\nhalf of turns, and agent use inside companies, are not visible in\nsession logs.\n  Interview question: Q#2.2, Q#9, Q#10", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 172}, {"from": "P12", "to": "GG12", "kind": "Gap", "title": "Hao et al. (2024) → Effects and reasons unasked\n\nGAP-040 Effects, reasons unasked: Effects on productivity and quality\nare not measured, and the reasons developers share or refine\nconversations are inferred from text, not asked.\n  Interview question: Q#2.3, Q#7, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 173}, {"from": "P3", "to": "GG12", "kind": "Gap", "title": "Cui et al. (2026) → Effects and reasons unasked\n\nGAP-009 Code quality effects: A more extensive study of code quality,\nsince effects look heterogeneous (build success fell at Accenture, no\ndecline at Microsoft).\n  Interview question: Q#2.3, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 174}, {"from": "P50", "to": "GG12", "kind": "Gap", "title": "Li et al. (2026) → Effects and reasons unasked\n\nGAP-139 Effects, not use: Effect, not use: study how ChatGPT affects\nproductivity, code quality and defect rates in controlled experiments\nwith and without it; the paper describes use only and measures no\noutcome.\n  Interview question: Q#2.3, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 175}, {"from": "P26", "to": "GG12", "kind": "Gap", "title": "Zakharov et al. (2025) → Effects and reasons unasked\n\nGAP-071 Roles versus outcomes: A short, correlational study with no\noutcome measures: whether the roles developers assign to AI change\nquality, speed or reliance is untested.\n  Interview question: Q#2.3, Q#9, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 176}, {"from": "P20", "to": "GG13", "kind": "Gap", "title": "Mozannar e encies are perceived, not\nmeasured; the authors say in-situ data would be more appropriate;\nrecall bias.\n  Interview question: Q#6", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 221}, {"from": "P9", "to": "GG27", "kind": "Gap", "title": "Huang et al. (2026) → Interface design, steering, stability\n\nGAP-030 Steering interfaces needed: Better interfaces for steering\nagents (testing, UI debugging, understanding failures, planning) and\nrigorous studies of best practices among the most productive\ndevelopers, then checks that agents measurably help.\n  Interview question: Q#3, Q#6, Q#7, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 222}, {"from": "P1", "to": "GG27", "kind": "Gap", "title": "Becker et al. (2025) → Interface design, steering, stability\n\nGAP-003 Why perceptions differ: Ask developers to explain the gap\nbetween forecast (24% faster), belief (20% faster) and the measured\n19% slowdown on a recent task.\n  Interview question: Q#2.3, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 223}, {"from": "P34", "to": "GG27", "kind": "Gap", "title": "Fetzer et al. (2026) → Interface design, steering, stability\n\nGAP-095 Agents, regulation gap: Explore architectures of GenAI-based\nmulti-agent systems and their autonomy, and bridge the gap between\nnormative initiatives (e.g. the EU AI Act) and practical approaches.\n  Interview question: Q#3, Q#4, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 224}, {"from": "P7", "to": "GG27", "kind": "Gap", "title": "Chen et al. (2026) → Interface design, steering, stability\n\nGAP-024 Explainable agent design: Design work on agents that explain\nwhat they did and why, balance proactivity, and make good use of human\neffort.\n  Interview question: Q#3, Q#10, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 225}, {"from": "P36", "to": "GG27", "kind": "Gap", "title": "Sergeyuk et al. (2026) → Interface desig  "kind": "Gap", "title": "Sergeyuk et al. (2026) → Junior and mentor views\n\nGAP-100 Senior-skewed sample: Interviewees were mostly senior (28\nseniors, 5 mid-level, 2 juniors), which may under-represent juniors'\nneeds; participants were JetBrains users, and prediction-market\nparticipants were JetBrains staff with possible insider knowledge.\n  Interview question: Q#1, Q#12, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 230}, {"from": "P39", "to": "GG30", "kind": "Gap", "title": "Kam et al. (2025) → Junior and mentor views\n\nGAP-110 Junior, mentor views: Whether the listed skill needs match\nwhat juniors, mentors and hiring managers experience is untested; the\nworkshop drew on developers at the cutting edge of AI use.\n  Interview question: Q#1, Q#7, Q#12, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 231}, {"from": "P33", "to": "GG32", "kind": "Gap", "title": "Stray et al. (2025) → Self-selection, non-randomised groups\n\nGAP-090 Satisfaction self-selection: Users report higher job\nsatisfaction than non-users (87% vs 73%), which the authors say may\nstem from self-selection.\n  Interview question: Q#10\nGAP-092 Adoption framework refinement: Validate and refine the HACAF\nadoption framework; ethical concerns were a central hindrance for\nnon-users but are not in the framework.\n  Interview question: Q#4, Q#5, Q#10, Q#13", "value": 2, "color": {"color": "#E45756", "opacity": 0.45}, "id": 232}, {"from": "P37", "to": "GG32", "kind": "Gap", "title": "Nguyen-Duc & Khanna (2024) → Self-selection, non-randomised groups\n\nGAP-105 Non-coding task delegation: Which non-coding tasks people\nactually hand to GenAI, and what they hold back, needs interviews with\nproduct owners, managers and other roles.\n  Interview question: Q#6, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 233}, {"from": "P41", "to": "GG33", "kind": "Gap", "title": "Zacharias et al. (2026) → Conceptual, no practitioner data\n\nGAP-114 Chatbot-era data: Fast-moving field: the data are from the\nchatbot era, while agentic systems that coordinate whole projects are\nnewer; findings on SDLC phases are suggestive, not conclusive.\n  Interview question: Q#2, Q#3, Q#8", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 234}, {"from": "P53", "to": "GG33", "kind": "Gap", "title": "Migliarini et al. (2026) → Conceptual, no practitioner data\n\nGAP-152 No practitioner input: Built from literature and governance\ntexts, with no interviews or field data: how organisations actually\nset, version and enforce prompt rules, who decides, and what\npractitioners know about workarounds, is not examined; the model and\ncards are not checked with practitioners.\n  Interview question: Q#4, Q#11, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 235}, {"from": "P34", "to": "GG34", "kind": "Gap", "title": "Fetzer et al. (2026) → Governance, silent use\n\nGAP-096 Developer-use governance: Governance of developers' own use of\nAI tools (as opposed to building GenAI products) is not covered.\n  Interview question: Q#4", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 236}, {"from": "P54", "to": "GG34", "kind": "Gap", "title": "Hassan et al. (2026) → Governance, silent use\n\nGAP-156 Teammate ownership, equity: Who owns a personalised AI\nteammate when its developer leaves (company IP or personal asset), and\nhow to keep an infrastructure-heavy way of working accessible,\nequitable and fair.\n  Interview question: Q#4, Q#13", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 237}, {"from": "P11", "to": "GG34", "kind": "Gap", "title": "Tang et al. (2026) → Governance, silent use\n\nGAP-036 Silent workarounds invisible: Only misalignment that\ndevelopers voiced is visible; silent workarounds are absent (unevenly\nby category); for 26.85% of episodes the cause is not visible and\nneeds richer instrumentation such as project-state snapshots.\n  Interview question: Q#4, Q#11", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 238}, {"from": "P14", "to": "GG34", "kind": "Gap", "title": "Tufano et al. (2026) → Governance, silent use\n\nGAP-044 Self-admitted use only: Only self-admitted use (commits,\nissues, PRs) in public GitHub repos; silent use, private code and code\ncomments are unseen. The authors note that real usage would need other\ninstruments, such as AI-code recognition or developer surveys and\ninterviews.\n  Interview question: Q#2, Q#5", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 239}, {"from": "P28", "to": "GG35", "kind": "Gap", "title": "Klemmer et al. (2024) → Single-company limits\n\nGAP-078 Rule-setters not interviewed: Company policies are driven by\ncompliance, and participants were rarely involved in setting them; the\npeople who set the rules were not interviewed.\n  Interview question: Q#4, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 240}, {"from": "P49", "to": "GG36", "kind": "Gap", "title": "Watanabe et al. (2026) → Method scope, metrics\n\nGAP-136 Quiet reviewer scepticism: Quantify the cost of building\ntrust: reviewer scepticism may act quietly (slow reviews, repeated\nrevision requests) and rarely shows as a stated reason; the authors\nsuggest mixed-method work that pairs review analytics with developer\ninterviews.\n  Interview question: Q#2.2, Q#9, Q#10", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 241}, {"from": "P13", "to": "GG36", "kind": "Gap", "title": "Ehsani et al. (2026) → Method scope, metrics\n\nGAP-043 Helpfulness judged externally: Helpfulness was judged from the\nthread (clone detection, manual inspection), not reported by the\ndevelopers who used the conversation.\n  Interview question: Q#2.3, Q#10", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 242}, {"from": "P8", "to": "GG36", "kind": "Gap", "title": "Otten et al. (2026) → Method scope, metrics\n\nGAP-027 Iteration and skill: Iteration correlates with skill and\nproductivity; study iterative methods further, e.g. letting users edit\nmodel parameters mid-conversation.\n  Interview question: Q#7, Q#8, Q#9", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 243}, {"from": "P8", "to": "GG37", "kind": "Gap", "title": "Otten et al. (2026) → Taxonomy, guidelines untested\n\nGAP-026 Incomplete prompting taxonomy: The prompting taxonomy is\nincomplete (users also avoided explanations or examples); the authors\ncall for a comprehensive taxonomy of interaction types to compare\neffectiveness across tasks and user groups.\n  Interview question: Q#7, Q#12", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 244}, {"from": "P43", "to": "GG37", "kind": "Gap", "title": "O'Brien (2025) → Taxonomy, guidelines untested\n\nGAP-121 Multi-site surveys, probes: Surveys at several universities\nand institutes on how scientists choose tools, design probes for the\nsupport scientists lack (translation, documentation, test generation),\nand community discussion of acceptable LLM practice and code testing\nin science.\n  Interview question: Q#2, Q#2.2, Q#4, Q#6", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 245}, {"from": "P45", "to": "GG38", "kind": "Gap", "title": "Hou et al. (2024) → Cost, trust, practice coverage\n\nGAP-125 Cost, trust, interpretability: Open challenges named by the\nauthors: applicability and cost, generalisability, evaluation metrics,\ninterpretability, trustworthiness and ethical use.\n  Interview question: Q#3, Q#4, Q#9, Q#13\nGAP-126 Practice coverage thin: Covers models, tasks and benchmarks;\nhow practitioners and organisations use the tools is barely covered,\nand software management appears in only 3 of 395 papers.\n  Interview question: Q#5, Q#6, Q#12", "value": 2, "color": {"color": "#E45756", "opacity": 0.45}, "id": 246}, {"from": "P46", "to": "GG38", "kind": "Gap", "title": "Amalfitano et al. (2026) → Cost, trust, practice coverage\n\nGAP-128 Per-form challenges: A research agenda of challenges for each\nform of augmentation, e.g. human-agent balance, user trust, control\nand override, legal and ethical assurance, benchmarks, and cost and\nsustainability.\n  Interview question: Q#4, Q#9, Q#10, Q#13", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 247}, {"from": "P31", "to": "GG38", "kind": "Gap", "title": "Yu et al. (2026) → Cost, trust, practice coverage\n\nGAP-083 Three organisations: Three organisations, so the metrics may\nnot generalise to other industries or regions; the study judges\noutputs and quality in practice, not the models themselves\n(cost-performance, licensing, infrastructure).\n  Interview question: Q#2.3, Q#3, Q#9, Q#13", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 248}, {"from": "P53", "to": "GG39", "kind": "Gap", "title": "Migliarini et al. (2026) → Open agenda, rapid change\n\nGAP-151 Four research questions: Four research questions with study\nblueprints: effect of policy and context binding plus provenance on\nreview quality and speed; transfer and robustness across models,\nversions and repositories; cost of safeguards and selective\nactivation; observable thresholds for escalating beyond the prompt\nlayer.\n  Interview question: Q#3, Q#4, Q#9, Q#13", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 249}, {"from": "P54", "to": "GG39", "kind": "Gap", "title": "Hassan et al. (2026) → Open agenda, rapid change\n\nGAP-155 People questions undeveloped: People questions are listed but\nnot developed: what a good engineer is in the SE 3.0 era, how to train\nthe next generation and redesign curricula, and how job offerings and\nthe motivation of engineers who love coding will change.\n  Interview question: Q#7, Q#10, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 250}, {"from": "P14", "to": "GG39", "kind": "Gap", "title": "Tufano et al. (2026) → Open agenda, rapid change\n\nGAP-046 Unexplained use shift: Why use shifted in two years (more\ndebugging help and learning; less refactoring, code review and comment\nwriting; fading privacy and context-window worries) is not explained.\n  Interview question: Q#6, Q#8", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 251}, {"from": "P36", "to": "GG39", "kind": "Gap", "title": "Sergeyuk et al. (2026) → Open agenda, rapid change\n\nGAP-101 Rapid-change period: Fieldwork (2024 to mid-2025) fell in a\nperiod of rapid change; needs, trust and priorities may shift as tools\nmature; thematic patterns cannot be statistically validated.\n  Interview question: Q#8, Q#9, Q#10, Q#13", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 252}, {"from": "P24", "to": "GG40", "kind": "Gap", "title": "Subramonyam et al. (2025) → Vision without evaluation\n\nGAP-067 Wider use cases: How teams map a wider range of use cases, how\nprototypes can be aligned with harm and bias concerns, and how to\ngather interface-level (not only output-level) feedback.\n  Interview question: Q#4, Q#6, Q#10, Q#14", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 253}, {"from": "P34", "to": "GG40", "kind": "Gap", "title": "Fetzer et al. (2026) → Vision without evaluation\n\nGAP-093 Single car maker: Built with one German premium car maker;\nmore practitioners and other business domains would strengthen\ntransferability; only three GenAI use cases were observed and the\nevolution stage is out of scope.\n  Interview question: Q#2, Q#6, Q#8", "value": 1, "color": {"color": "#E45756", "opacity": 0.45}, "id": 254}];

const nodes = new vis.DataSet(allNodes);
const edges = new vis.DataSet(allEdges);
const show = { Finding: true, Gap: true };
let hideIsolated = false;

// Year filter: one checkbox per paper year
const paperYear = {};
const yearCounts = {};
allNodes.filter(n => n.group === "Paper").forEach(n => {
  paperYear[n.id] = String(n.year);
  yearCounts[n.year] = (yearCounts[n.year] || 0) + 1;
});
const showYear = {};
const yearsBox = document.getElementById("years");
Object.keys(yearCounts).sort().forEach(y => {
  showYear[y] = true;
  const label = document.createElement("label");
  label.innerHTML = `<input type="checkbox" checked> ${y} <span class="count">(${yearCounts[y]})</span>`;
  const box = label.querySelector("input");
  box.dataset.year = y;
  box.onchange = () => { showYear[y] = box.checked; refresh(); };
  yearsBox.appendChild(label);
});
function setAllYears(on) {
  yearsBox.querySelectorAll("input").forEach(b => { b.checked = on; showYear[b.dataset.year] = on; });
  refresh();
}
document.getElementById("yearsAll").onclick = () => setAllYears(true);
document.getElementById("yearsNone").onclick = () => setAllYears(false);

// An edge is visible when its group type is on and its paper's year is on;
// a group is visible only while it still has a visible edge.
const edgeVisible = e => show[e.kind] && showYear[paperYear[e.from]];
const nodeView = new vis.DataView(nodes, { filter: n => {
  if (n.group !== "Paper") return show[n.group] && allEdges.some(e => e.to === n.id && edgeVisible(e));
  if (!showYear[String(n.year)]) return false;
  if (!hideIsolated) return true;
  return allEdges.some(e => e.from === n.id && edgeVisible(e));
} });
const edgeView = new vis.DataView(edges, { filter: edgeVisible });

const network = new vis.Network(document.getElementById("network"),
  { nodes: nodeView, edges: edgeView }, {
    nodes: { font: { size: 13 }, scaling: { min: 8, max: 30 } },
    edges: { smooth: false, scaling: { min: 1, max: 6 } },
    physics: { solver: "forceAtlas2Based",
               forceAtlas2Based: { gravitationalConstant: -60, springLength: 120 },
               stabilization: { iterations: 300 } },
    interaction: { hover: true, tooltipDelay: 120, navigationButtons: true }
  });
network.once("stabilizationIterationsDone", () => network.setOptions({ physics: false }));

function refresh() { nodeView.refresh(); edgeView.refresh(); }
document.getElementById("showFinding").onchange = e => { show.Finding = e.target.checked; refresh(); };
document.getElementById("showGap").onchange = e => { show.Gap = e.target.checked; refresh(); };
document.getElementById("hideIsolated").onchange = e => { hideIsolated = e.target.checked; refresh(); };

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { network.unselectAll(); return; }
  const hits = nodeView.get({ filter: n => (n.label + " " + n.title).toLowerCase().includes(q) })
                       .map(n => n.id);
  network.selectNodes(hits);
  if (hits.length) network.fit({ nodes: hits, animation: true });
});
</script>
